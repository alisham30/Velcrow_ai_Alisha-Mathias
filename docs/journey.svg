<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" viewBox="0 0 1180 470" font-family="Segoe UI, Arial, sans-serif">
<rect width="1180" height="470" fill="#ffffff"/>
<text x="40" y="46" font-size="18" fill="#1c1c1c" text-anchor="start" font-weight="700">Online today: many buyers, many channels, nobody owns the journey</text>
<text x="40" y="70" font-size="13" fill="#5a5a5a" text-anchor="start">human buyers, humans with AI helpers, AI agents - arriving by web, WhatsApp, marketplaces, agent protocols</text>
<rect x="40" y="94" width="170" height="56" rx="12" fill="#efefef" stroke="#c8c8c8" stroke-width="1.4"/>
<text x="125.0" y="128" font-size="15" fill="#6b6b6b" text-anchor="middle" font-weight="600">Walk in</text>
<line x1="213.0" y1="114" x2="223.0" y2="130" stroke="#e8613c" stroke-width="2.2" stroke-linecap="round"/>
<line x1="223.0" y1="114" x2="213.0" y2="130" stroke="#e8613c" stroke-width="2.2" stroke-linecap="round"/>
<line x1="54" y1="166" x2="196" y2="166" stroke="#e8613c" stroke-width="3" stroke-linecap="round"/>
<text x="125.0" y="192" font-size="13" fill="#1c1c1c" text-anchor="middle" font-weight="600">No one to ask</text>
<rect x="226" y="94" width="170" height="56" rx="12" fill="#efefef" stroke="#c8c8c8" stroke-width="1.4"/>
<text x="311.0" y="128" font-size="15" fill="#6b6b6b" text-anchor="middle" font-weight="600">Find</text>
<line x1="399.0" y1="114" x2="409.0" y2="130" stroke="#e8613c" stroke-width="2.2" stroke-linecap="round"/>
<line x1="409.0" y1="114" x2="399.0" y2="130" stroke="#e8613c" stroke-width="2.2" stroke-linecap="round"/>
<line x1="240" y1="166" x2="382" y2="166" stroke="#e8613c" stroke-width="3" stroke-linecap="round"/>
<text x="311.0" y="192" font-size="13" fill="#1c1c1c" text-anchor="middle" font-weight="600">Coupon missed</text>
<rect x="412" y="94" width="170" height="56" rx="12" fill="#efefef" stroke="#c8c8c8" stroke-width="1.4"/>
<text x="497.0" y="128" font-size="15" fill="#6b6b6b" text-anchor="middle" font-weight="600">Compare</text>
<line x1="585.0" y1="114" x2="595.0" y2="130" stroke="#e8613c" stroke-width="2.2" stroke-linecap="round"/>
<line x1="595.0" y1="114" x2="585.0" y2="130" stroke="#e8613c" stroke-width="2.2" stroke-linecap="round"/>
<line x1="426" y1="166" x2="568" y2="166" stroke="#e8613c" stroke-width="3" stroke-linecap="round"/>
<text x="497.0" y="192" font-size="13" fill="#1c1c1c" text-anchor="middle" font-weight="600">Cheaper shop unknown</text>
<rect x="598" y="94" width="170" height="56" rx="12" fill="#efefef" stroke="#c8c8c8" stroke-width="1.4"/>
<text x="683.0" y="128" font-size="15" fill="#6b6b6b" text-anchor="middle" font-weight="600">Cart</text>
<line x1="771.0" y1="114" x2="781.0" y2="130" stroke="#e8613c" stroke-width="2.2" stroke-linecap="round"/>
<line x1="781.0" y1="114" x2="771.0" y2="130" stroke="#e8613c" stroke-width="2.2" stroke-linecap="round"/>
<line x1="612" y1="166" x2="754" y2="166" stroke="#e8613c" stroke-width="3" stroke-linecap="round"/>
<text x="683.0" y="192" font-size="13" fill="#1c1c1c" text-anchor="middle" font-weight="600">Asked 6, had 5: sale dies</text>
<rect x="784" y="94" width="170" height="56" rx="12" fill="#efefef" stroke="#c8c8c8" stroke-width="1.4"/>
<text x="869.0" y="128" font-size="15" fill="#6b6b6b" text-anchor="middle" font-weight="600">Pay</text>
<line x1="957.0" y1="114" x2="967.0" y2="130" stroke="#e8613c" stroke-width="2.2" stroke-linecap="round"/>
<line x1="967.0" y1="114" x2="957.0" y2="130" stroke="#e8613c" stroke-width="2.2" stroke-linecap="round"/>
<line x1="798" y1="166" x2="940" y2="166" stroke="#e8613c" stroke-width="3" stroke-linecap="round"/>
<text x="869.0" y="192" font-size="13" fill="#1c1c1c" text-anchor="middle" font-weight="600">Bill unchecked</text>
<rect x="970" y="94" width="170" height="56" rx="12" fill="#efefef" stroke="#c8c8c8" stroke-width="1.4"/>
<text x="1055.0" y="128" font-size="15" fill="#6b6b6b" text-anchor="middle" font-weight="600">Come back</text>
<line x1="984" y1="166" x2="1126" y2="166" stroke="#e8613c" stroke-width="3" stroke-linecap="round"/>
<text x="1055.0" y="192" font-size="13" fill="#1c1c1c" text-anchor="middle" font-weight="600">Never told it&#8217;s back</text>
<rect x="40" y="234" width="1100" height="168" rx="16" fill="#e6f4ef" stroke="#1f8a70" stroke-width="1.8"/>
<text x="590.0" y="264" font-size="17" fill="#1f8a70" text-anchor="middle" font-weight="700">One agent across every step - every leak answered where it happened</text>
<line x1="125.0" y1="296" x2="1055.0" y2="296" stroke="#1f8a70" stroke-width="4" stroke-linecap="round"/>
<circle cx="125.0" cy="296" r="6" fill="#ffffff" stroke="#1f8a70" stroke-width="2.5"/>
<text x="125.0" y="334" font-size="13" fill="#1f8a70" text-anchor="middle" font-weight="600">Just say it</text>
<circle cx="311.0" cy="296" r="6" fill="#ffffff" stroke="#1f8a70" stroke-width="2.5"/>
<text x="311.0" y="328" font-size="13" fill="#1f8a70" text-anchor="middle" font-weight="600">Coupon claimed,</text>
<text x="311.0" y="346" font-size="13" fill="#1f8a70" text-anchor="middle" font-weight="600">pairing offered</text>
<circle cx="497.0" cy="296" r="6" fill="#ffffff" stroke="#1f8a70" stroke-width="2.5"/>
<text x="497.0" y="328" font-size="13" fill="#1f8a70" text-anchor="middle" font-weight="600">Cheapest of</text>
<text x="497.0" y="346" font-size="13" fill="#1f8a70" text-anchor="middle" font-weight="600">6 shops, ranked</text>
<circle cx="683.0" cy="296" r="6" fill="#ffffff" stroke="#1f8a70" stroke-width="2.5"/>
<text x="683.0" y="328" font-size="13" fill="#1f8a70" text-anchor="middle" font-weight="600">The 6th is</text>
<text x="683.0" y="346" font-size="13" fill="#1f8a70" text-anchor="middle" font-weight="600">held, not lost</text>
<circle cx="869.0" cy="296" r="6" fill="#ffffff" stroke="#1f8a70" stroke-width="2.5"/>
<text x="869.0" y="334" font-size="13" fill="#1f8a70" text-anchor="middle" font-weight="600">Exact-amount escrow</text>
<circle cx="1055.0" cy="296" r="6" fill="#ffffff" stroke="#1f8a70" stroke-width="2.5"/>
<text x="1055.0" y="328" font-size="13" fill="#1f8a70" text-anchor="middle" font-weight="600">Restocked? You&#8217;re</text>
<text x="1055.0" y="346" font-size="13" fill="#1f8a70" text-anchor="middle" font-weight="600">told first</text>
<text x="590.0" y="384" font-size="13" fill="#5a5a5a" text-anchor="middle">and an escrow behind every payment - money moves only when every condition is met</text>
<text x="40" y="440" font-size="12" fill="#5a5a5a" text-anchor="start">Gray: disconnected tools.   Coral: where the hand-off breaks and revenue leaks.   Teal: one continuous agent.</text>
</svg>
