<rect x="20" y="552" width="1140" height="56" rx="5" fill="#ffffff" stroke="#12181c" stroke-width="1.5"/>
<text x="590.0" y="575" font-size="14" fill="#12181c" text-anchor="middle" font-weight="700">THE GAP: many channels, many pain points - and no single force reaching all of them.</text>
<text x="590.0" y="596" font-size="12" fill="#5c6a64" text-anchor="middle">Fix one step and the sale still dies at the next. Growth needs one presence at EVERY step - for human buyers using AI, and for AI buyers.</text>
<rect x="20" y="622" width="1140" height="52" rx="5" fill="#f5ecd6" stroke="#8a6410" stroke-width="1.8"/>
<text x="590.0" y="645" font-size="14.5" fill="#12181c" text-anchor="middle" font-weight="700">SO: what if an AI could be that helper - at every step, on every channel, for everyone who shops?</text>
<text x="590.0" y="664" font-size="11.5" fill="#5c6a64" text-anchor="middle" font-style="italic">one agent brain, every door, one escrow behind them  &#8594;  next slide</text>
